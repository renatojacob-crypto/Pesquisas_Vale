<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Gerencial - Oficinas Vale</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Bibliotecas Necessárias -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        .dashboard-container { max-width: 1200px; width: 100%; padding: 20px; background: rgba(255,255,255,0.95); border-radius: 12px; margin-bottom: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .filtros-bar { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; background: #f8fbf9; padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); }
        .filtro-item { flex: 1; min-width: 200px; display: flex; flex-direction: column; }
        .filtro-item label { font-size: 13px; color: var(--primary-color); margin-bottom: 5px; font-weight: bold; }
        .filtro-item select { padding: 10px; border-radius: 6px; border: 1px solid #ccc; outline: none; }
        
        /* Nova Barra de Ações (Exportação e E-mail) */
        .acoes-bar { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 30px; align-items: center; justify-content: space-between; background: #fff; padding: 15px 20px; border-radius: 8px; border: 1px solid var(--border-color); }
        .btn-acao { background-color: var(--primary-color); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-acao:hover { background-color: var(--primary-hover); }
        .btn-acao:disabled { background-color: #ccc; cursor: not-allowed; }
        
        .email-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .email-input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; width: 250px; outline: none; }
        .email-input:focus { border-color: var(--primary-color); }

        .kpi-cards { display: flex; gap: 20px; margin-bottom: 30px; }
        .kpi-card { flex: 1; background: var(--primary-color); color: white; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 4px 10px rgba(0,127,95,0.2); }
        .kpi-valor { font-size: 36px; font-weight: bold; margin-top: 10px; }
        
        .graficos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 30px; }
        .grafico-box { background: white; padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; }
        .grafico-titulo { font-size: 14px; font-weight: 600; margin-bottom: 15px; text-align: center; color: #333; min-height: 40px; width: 100%; }
        .canvas-container { width: 100%; height: 250px; position: relative; }
        
        #loading-msg { text-align: center; font-size: 18px; color: var(--primary-color); font-weight: bold; margin: 40px 0; }
        
        /* Oculta os botões de ação na hora de imprimir o PDF */
        .html2pdf__container .acoes-bar, .html2pdf__container .nav-back { display: none !important; }
    </style>
</head>
<body>
    <header class="portal-header">
        <div class="header-content">
            <h1>Dashboard Gerencial</h1>
            <p>Resultados das Oficinas Vale nas Escolas</p>
        </div>
    </header>

    <main class="dashboard-container animate-fade">
        <div class="nav-back">
            <a href="index.html" class="btn-voltar">← Voltar ao Portal</a>
        </div>

        <div id="loading-msg">🔄 Carregando dados da base... Isto pode levar alguns segundos.</div>

        <div id="dashboard-content" class="hidden">
            
            <div class="filtros-bar">
                <div class="filtro-item"><label>Perfil Analisado</label><select id="filtro-perfil"><option value="Professor">Professores</option><option value="Aluno">Alunos</option></select></div>
                <div class="filtro-item"><label>Oficina</label><select id="filtro-oficina"><option value="Todas">Todas as Oficinas</option></select></div>
                <div class="filtro-item"><label>Regional</label><select id="filtro-regional"><option value="Todas">Todas as Regionais</option></select></div>
                <div class="filtro-item"><label>Período (Mês)</label><select id="filtro-mes"><option value="Todos">Todos os Meses</option></select></div>
            </div>

            <!-- NOVA ÁREA: Exportação e E-mail -->
            <div class="acoes-bar">
                <button class="btn-acao" id="btn-gerar-pdf" onclick="exportarPDF()">📄 Exportar PDF</button>
                
                <div class="email-group">
                    <input type="email" id="input-email" class="email-input" placeholder="Digite o e-mail de destino..." required>
                    <button class="btn-acao" id="btn-enviar-email" onclick="enviarPorEmail()">✉️ Enviar por E-mail</button>
                </div>
            </div>

            <!-- Área que será exportada para o PDF -->
            <div id="area-exportacao">
                <div class="kpi-cards">
                    <div class="kpi-card">
                        <div>Total de Respostas (Filtradas)</div>
                        <div class="kpi-valor" id="total-respostas">0</div>
                    </div>
                </div>

                <div class="graficos-grid" id="area-graficos">
                    <!-- Gerados via JS -->
                </div>
            </div>
        </div>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
