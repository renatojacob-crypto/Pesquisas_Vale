<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Gerencial - Oficinas Vale</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Estilos específicos do Dashboard */
        .dashboard-container { max-width: 1200px; width: 100%; padding: 20px; background: rgba(255,255,255,0.95); border-radius: 12px; margin-bottom: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .filtros-bar { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 30px; background: #f8fbf9; padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); }
        .filtro-item { flex: 1; min-width: 200px; display: flex; flex-direction: column; }
        .filtro-item label { font-size: 13px; color: var(--primary-color); margin-bottom: 5px; }
        .filtro-item select { padding: 10px; border-radius: 6px; border: 1px solid #ccc; outline: none; }
        
        .kpi-cards { display: flex; gap: 20px; margin-bottom: 30px; }
        .kpi-card { flex: 1; background: var(--primary-color); color: white; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 4px 10px rgba(0,127,95,0.2); }
        .kpi-valor { font-size: 36px; font-weight: bold; margin-top: 10px; }
        
        .graficos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 30px; }
        .grafico-box { background: white; padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; }
        .grafico-titulo { font-size: 14px; font-weight: 600; margin-bottom: 15px; text-align: center; color: #333; min-height: 40px; }
        .canvas-container { width: 100%; height: 250px; position: relative; }
        
        #loading-msg { text-align: center; font-size: 18px; color: var(--primary-color); font-weight: bold; margin: 40px 0; }
    </style>
</head>
<body>
    <header class="portal-header">
        <div class="header-content">
            <h1>Dashboard Gerencial</h1>
            <p>Resultados das Oficinas Vale nas Escolas</p>
        </div>
    </header>

    <main class="dashboard-container animate-fade">
        <div class="nav-back">
            <a href="index.html" class="btn-voltar">← Voltar ao Portal</a>
        </div>

        <div id="loading-msg">🔄 Carregando dados da base... Isso pode levar alguns segundos.</div>

        <div id="dashboard-content" class="hidden">
            <div class="filtros-bar">
                <div class="filtro-item">
                    <label>Perfil Analisado</label>
                    <select id="filtro-perfil">
                        <option value="Professor">Professores</option>
                        <option value="Aluno">Alunos</option>
                    </select>
                </div>
                <div class="filtro-item">
                    <label>Oficina</label>
                    <select id="filtro-oficina"><option value="Todas">Todas as Oficinas</option></select>
                </div>
                <div class="filtro-item">
                    <label>Regional</label>
                    <select id="filtro-regional"><option value="Todas">Todas as Regionais</option></select>
                </div>
                <div class="filtro-item">
                    <label>Período (Mês)</label>
                    <select id="filtro-mes"><option value="Todos">Todos os Meses</option></select>
                </div>
            </div>

            <div class="kpi-cards">
                <div class="kpi-card">
                    <div>Total de Respostas (Filtradas)</div>
                    <div class="kpi-valor" id="total-respostas">0</div>
                </div>
            </div>

            <div class="graficos-grid" id="area-graficos">
                </div>
        </div>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
